name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brands live in home-assistant/brands (separate review PR). Skip the
          # brands check for the custom-repository workflow; revisit for default store.
          ignore: brands
